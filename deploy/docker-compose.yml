# CRTDH CMS zone - production stack (lab server). See deploy/README.md.
#
# Nothing here publishes a host port. The only way in is the Cloudflare tunnel:
#   cms.<domain>      -> gateway (admin SPA + /api/ + /oauth/authorize/), behind Cloudflare Access
#   contact.<domain>  -> gateway, which allows only POST /api/v1/contact/
#   mcp.<domain>      -> mcp (only /mcp, OAuth metadata and token paths; WAF: Anthropic range only)
# Every secret comes from deploy/.env (never committed; copy .env.example).
# No seeding and no default users: create the first admin as in README step 4.
#
# Networks: `internal` (no internet) holds everything; gateway and cloudflared have fixed addresses
# on it. Only those two addresses may talk to the app processes: Django's TrustedProxyMiddleware
# (REQUIRE_TRUSTED_PROXY + TRUSTED_PROXY_IPS) refuses any other peer, because "no published port" does
# not stop a process on the server from reaching a container's bridge address directly. `egress` is
# outbound only and joined just by the containers that must reach the internet (README "Network").

name: crtdh-cms

x-backend: &backend
  build:
    context: ../backend
  image: crtdh-backend:prod
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    DEBUG: "False"
    CRTDH_ENV: production
    TRUST_CF_CONNECTING_IP: "True"
    # gateway, cloudflared (fixed below). Forwarding headers from any other peer are ignored/refused.
    TRUSTED_PROXY_IPS: 172.30.80.10,172.30.80.11
    REQUIRE_TRUSTED_PROXY: "True"
    STATIC_ROOT: /data/static
    MEDIA_ROOT: /data/media
    PUBLISH_ROOT: /data/publish
  volumes:
    - media_data:/data/media
    - static_data:/data/static
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [internal]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  # One-shot: schema + cache table, then exits. Content is never reseeded.
  migrate:
    <<: *backend
    restart: "no"
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py createcachetable
      && python manage.py collectstatic --noinput --clear -v 0"
    depends_on:
      db:
        condition: service_healthy

  cms:
    <<: *backend
    volumes:
      - media_data:/data/media
      - static_data:/data/static
      # Serves the worker's tarballs to the publish agent (GET /api/v1/agent/builds/<id>.tar.gz).
      - publish_data:/data/publish:ro
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
      --limit-request-line 8190 --access-logfile - --worker-tmp-dir /tmp
    # Outbound: Turnstile siteverify and SMTP.
    networks: [internal, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # MCP server (mcp lane): ASGI, so long-lived MCP sessions never hold gunicorn workers.
  mcp:
    <<: *backend
    command: >
      uvicorn mcp_server.asgi:app --host 0.0.0.0 --port 8400 --no-proxy-headers
      --forwarded-allow-ips 172.30.80.11 --no-server-header
    # No uvicorn proxy-header rewriting: the peer must stay cloudflared's address so the
    # trusted-proxy check holds; Django reads CF-Connecting-IP/X-Forwarded-Proto from that peer only.
    # Outbound: upload_image_from_url (SSRF-guarded fetch in mcp_server/fetch.py).
    networks: [internal, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Builds publish tarballs for the campus publish agent (publishing lane). Its own image: the backend plus
  # Node 22 and frontend/ with its build dependencies (deploy/worker/Dockerfile), still read-only and non-root.
  worker:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    image: crtdh-worker:prod
    command: python manage.py run_publish_worker
    environment:
      <<: *backend-env
      # Set here so stale values in .env can't override the image's (compose environment beats env_file).
      PUBLISH_ROOT: /data/publish
      FRONTEND_BUILD_CMD: /usr/local/bin/crtdh-build-site
      FRONTEND_BUILD_OUTPUT: /tmp/site/build/client
    volumes:
      - media_data:/data/media:ro
      - publish_data:/data/publish
    # The site build (/tmp/site), Vite/React Router temp files and the npm cache.
    tmpfs:
      - /tmp:size=1g
    # Outbound: review/publish notification email (SMTP).
    networks: [internal, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Daily housekeeping: contact-message retention (docs/privacy-notice.md), expired sessions, auth throttles and
  # expired/revoked Claude connector OAuth tokens (django-oauth-toolkit cleartokens).
  housekeeping:
    <<: *backend
    command: >
      sh -c "while true; do python manage.py purge_contact_messages && python manage.py clearsessions
      && python manage.py clear_auth_throttles && python manage.py cleartokens; sleep 86400; done"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Admin SPA + reverse proxy for cms.<domain> and contact.<domain>.
  gateway:
    build:
      context: ..
      dockerfile: admin/Dockerfile  # root context: the canvas needs frontend/src/site
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in deploy/.env}
    restart: unless-stopped
    environment:
      CMS_HOST: ${CMS_HOST:?set CMS_HOST in deploy/.env}
      CONTACT_HOST: ${CONTACT_HOST:?set CONTACT_HOST in deploy/.env}
      NGINX_ENVSUBST_FILTER: "^(CMS_HOST|CONTACT_HOST)$"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - static_data:/srv/static:ro
    # Read-only root; envsubst renders into the conf.d tmpfs (which also hides the image's own
    # catch-all default.conf). Root master only binds :80 and drops to the nginx user for workers.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:mode=0755
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    depends_on:
      cms:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    networks:
      internal:
        ipv4_address: 172.30.80.10

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?pin cloudflare/cloudflared:<version>@sha256:<digest> in deploy/.env}
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - gateway
      - mcp
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    networks:
      internal:
        ipv4_address: 172.30.80.11
      egress: {}

networks:
  # No route to the internet. Fixed subnet so TRUSTED_PROXY_IPS can name gateway and cloudflared.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.80.0/24
  # Outbound only (cloudflared to the Cloudflare edge; cms Turnstile/SMTP; mcp URL fetch; worker SMTP).
  # Nothing is published on the host. db, migrate, housekeeping and gateway are not on it.
  egress:
    ipam:
      config:
        - subnet: 172.30.81.0/24

volumes:
  pgdata:
  media_data:
  static_data:
  publish_data:   # worker: snapshots, content-hashed media, tarballs (cms reads tarballs)

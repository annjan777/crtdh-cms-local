# Staging stand-in for the CIC web server (Apache 2.4, official httpd image). Not used in production.
# Serves the SFTP account's web root (named volume site_www, read-only) as https://${SITE_HOST}/ behind the tunnel.
# Like a typical shared host it honours .htaccess with AllowOverride FileInfo only, so the .htaccess that
# frontend/scripts/postbuild.mjs writes is tested as is (ErrorDocument, Header, SetEnvIf, AddType), and so is the
# publish agent's discovery (.htaccess RewriteRule probe, symlinked web root, symlinked _media).
ServerRoot "/usr/local/apache2"
Listen 80

# Guarded so the file also loads where some of these are compiled in.
<IfModule !mpm_event_module>
    LoadModule mpm_event_module modules/mod_mpm_event.so
</IfModule>
<IfModule !authz_core_module>
    LoadModule authz_core_module modules/mod_authz_core.so
</IfModule>
<IfModule !authz_host_module>
    LoadModule authz_host_module modules/mod_authz_host.so
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module modules/mod_unixd.so
</IfModule>
<IfModule !log_config_module>
    LoadModule log_config_module modules/mod_log_config.so
</IfModule>
<IfModule !mime_module>
    LoadModule mime_module modules/mod_mime.so
</IfModule>
<IfModule !dir_module>
    LoadModule dir_module modules/mod_dir.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !setenvif_module>
    LoadModule setenvif_module modules/mod_setenvif.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

User www-data
Group www-data

# TLS ends at Cloudflare; the scheme here makes self-referential redirects (mod_dir's /about -> /about/) use
# https://${SITE_HOST}/..., as the real HTTPS host does.
ServerName https://${SITE_HOST}
UseCanonicalName On
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerAdmin webmaster@localhost

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%{CF-Connecting-IP}i %h %l %u %t \"%r\" %>s %b \"%{User-Agent}i\"" cf
CustomLog /proc/self/fd/1 cf

TypesConfig conf/mime.types
AddDefaultCharset Off
DirectoryIndex index.html

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

# The agent's layout lives under /srv/www: public_html (a link to crtdh-releases/releases/<id> once the symlink
# strategy is in use) and crtdh-releases/. No Indexes: a folder without index.html is 403, never a listing.
DocumentRoot "/srv/www/public_html"
<Directory "/srv/www">
    Options FollowSymLinks
    AllowOverride FileInfo
    Require all granted
</Directory>

<Files ".ht*">
    Require all denied
</Files>

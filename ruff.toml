# CI lint gate (QA lane). Deliberately small: correctness only (syntax, undefined names, unused/
# redefined imports, bad comparisons). Style is not gated. Widen per package with its own config.
target-version = "py313"
line-length = 120
extend-exclude = ["**/migrations/**", "**/node_modules/**", "frontend", "admin", ".preprod"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731", "E741"]

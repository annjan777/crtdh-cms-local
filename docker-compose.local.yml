name: crtdh-cms-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crtdh
      POSTGRES_USER: crtdh
      POSTGRES_PASSWORD: localpassword
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crtdh -d crtdh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Dev only. No users are created automatically: run
    #   docker compose -f docker-compose.local.yml exec backend python manage.py create_dev_users
    # which prints random passwords once (it refuses to run with DEBUG off).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py bootstrap_local &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      # Local-only key (DEBUG=True never runs the production checks). Never reuse anywhere else.
      SECRET_KEY: local-dev-only-not-secret
      DEBUG: "True"
      CRTDH_ENV: development
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      # The admin dev server (3001) calls the API on 8000 with the session cookie.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173"
      CORS_URLS_REGEX: "^/api/.*$"
      CORS_ALLOW_CREDENTIALS: "True"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173"
      DATABASE_URL: "postgres://crtdh:localpassword@db:5432/crtdh"
    volumes:
      - media_data_local:/app/media
      - static_data_local:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000/api/v1"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: "http://localhost:8000/api/v1"
        VITE_PUBLIC_SITE_URL: "http://localhost:3000"
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata_local:
  media_data_local:
  static_data_local:

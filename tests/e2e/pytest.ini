[pytest]
testpaths = .
addopts = -ra --strict-markers -p no:cacheprovider --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output ../../test-results/e2e
asyncio_default_fixture_loop_scope = function
markers =
    needs_integration: depends on other lanes (skipped unless --integration)
    a11y: accessibility check
    visual: screenshot baseline
    perf: performance budget
    mcp: Claude connector path

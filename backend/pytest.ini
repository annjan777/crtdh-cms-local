[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py tests.py
testpaths = apps tests
addopts = -ra --strict-markers --reuse-db -p no:cacheprovider
timeout = 120
markers =
    needs_integration: depends on another lane's code (skipped unless --integration or RUN_INTEGRATION=1)
    slow: takes more than a few seconds
    security: security regression (RBAC, SSRF, uploads, headers, config)
    contract: checks a v3-contracts.md shape (error body, snapshot schema, API paths)
    regression_critical: one of the two CRITICAL regression checks in TEST-PLAN
filterwarnings =
    ignore::DeprecationWarning:factory.*

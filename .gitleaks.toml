# gitleaks config (CI security job). Default rules plus reviewed allowlist entries only.
[extend]
useDefault = true

[allowlist]
description = "Published test values, not secrets"
regexes = [
  # Cloudflare Turnstile's documented always-pass test secret (tests and E2E only)
  '''1x0000000000000000000000000000000AA''',
]
paths = [
  # throwaway values in the CI-only Postgres service and test settings
  '''^\.github/workflows/ci\.yml$''',
  '''^backend/config/settings_test\.py$''',
]


# Reviewed false positives (lead-approved 19 Nov): narrow, per rule + exact file + exact line shape.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "admin dev mock API: fake temporary passwords 'tmp-xxxx-xxxx' returned by mock user endpoints"
condition = "AND"
paths = ['''^admin/src/mock/server\.js$''']
regexTarget = "line"
regexes = ['''temporary_password: 'tmp-[A-Za-z0-9]{4}(-[A-Za-z0-9]{4})+''']
[[rules.allowlists]]
description = "publish agent keygen: default key *file name*, not key material"
condition = "AND"
paths = ['''^publish_agent/agent\.py$''']
regexTarget = "line"
regexes = ['''default=os\.path\.join\("keys", "crtdh_publish_ed25519"\)''']

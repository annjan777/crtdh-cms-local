; CRTDH publish agent configuration. Copy to config.ini next to the publish_agent folder and edit.
; Never put a password or the agent secret in this file (the agent refuses to start if you do).

[cms]
; Address of the private CMS (as reachable from this PC).
url = https://cms.crtdh.example
; The shared agent secret (same value as AGENT_HMAC_SECRET on the CMS) is read from this file...
secret_file = agent-secret.txt
; ...or, if that file is missing or empty, from this environment variable.
secret_env = CRTDH_AGENT_SECRET
; How often to ask the CMS for a new build (seconds).
poll_seconds = 30
; cms.<domain> is behind Cloudflare Access: the agent sends a service token on every request (deploy/README.md,
; "Publish agent and Cloudflare Access"). The id goes here; the secret, like the agent secret, is read from
; access_secret_file or else the CRTDH_CF_ACCESS_SECRET environment variable. Never put the secret in this file.
; access_client_id = 0123456789abcdef.access
; access_secret_file = access-secret.txt
; Give up on a build (report it failed at "download") after this many failed downloads in a row.
max_download_errors = 5

[sftp]
host = academicweb.iitkgp.ac.in
port = 22
; The hosting account's user name.
user = CHANGE_ME
; Private SSH key made with ssh-keygen (recommended). Leave empty to use a password from the system keyring
; (python -m publish_agent set-password).
key_file = keys/crtdh_publish_ed25519
; known_hosts = state/known_hosts   (default; filled by `check --trust-host-key`)

[site]
; Folder the web server serves for crtdh.iitkgp.ac.in, as seen after SFTP login. `check` lists candidates.
web_root = ~/public_html
; auto = use what `check` recommends; or force one of: symlink, htaccess, swap, copy
strategy = auto
; Previous releases kept on the server for rollback (besides the live one).
keep_releases = 3
; After switching, the agent loads this page and looks for <meta name="crtdh-build" content="<snapshot id>">.
; If it does not appear, the previous release is put back. Leave empty to skip the check.
verify_url = https://crtdh.iitkgp.ac.in/
verify_marker = crtdh-build
; base_dir =        (where releases are stored; default chosen per strategy, see README)

[agent]
; Logs, backups, downloads and local state. Relative paths are relative to this file.
state_dir = state
